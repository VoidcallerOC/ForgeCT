name: Scheduled production smoke

# Smallest reliable uptime signal using existing GET-only smoke runner.
# Failures notify repository watchers / GitHub notification settings for this workflow.
# Does not submit forms, create payments, or write customer data.

on:
  schedule:
    # Every 6 hours UTC
    - cron: "17 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-smoke:
    name: Smoke production (scheduled)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run GET-only production smoke checks
        run: npm run test:smoke:production
