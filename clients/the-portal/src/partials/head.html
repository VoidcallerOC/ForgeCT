<!doctype html>
<html lang="en" class="no-js">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    <meta name="robots" content="{{robots}}" />
    <link rel="canonical" href="{{canonical}}" />
    <meta name="theme-color" content="#08070d" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Portal" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:url" content="{{canonical}}" />
    <meta property="og:image" content="/assets/img/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="/assets/css/portal.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "HobbyShop",
        "name": "The Portal",
        "description": "Tabletop game store in Manchester, Connecticut: board games, collectible card games, miniatures and roleplaying games, with a large gaming space and a library of over five hundred titles.",
        "url": "https://www.theportalct.com/",
        "telephone": "+1-860-432-0711",
        "email": "bryan@theportalct.com",
        "image": "https://www.theportalct.com/assets/img/og.jpg",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "60 Hilliard St",
          "addressLocality": "Manchester",
          "addressRegion": "CT",
          "postalCode": "06042",
          "addressCountry": "US"
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Sunday", "Monday"],
            "opens": "12:00",
            "closes": "20:00"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Tuesday", "Wednesday", "Thursday"],
            "opens": "12:00",
            "closes": "23:00"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": "Friday",
            "opens": "12:00",
            "closes": "23:59"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": "Saturday",
            "opens": "10:00",
            "closes": "22:00"
          }
        ],
        "sameAs": [
          "https://www.facebook.com/TimeMachinePortal",
          "https://www.youtube.com/channel/UCmAA9f_4bv7snlh8NGSodug"
        ]
      }
    </script>
    <script src="/assets/js/portal.js" defer></script>
  </head>
  <body class="{{bodyClass}}">
    <a class="skip" href="#main">Skip to content</a>
    <div class="demo-ribbon" role="note">
      <span
        ><strong>Concept preview</strong> by Forge&nbsp;CT for The Portal. Not
        the official site.</span
      >
      <button
        type="button"
        class="demo-ribbon__close"
        aria-label="Hide preview notice"
        data-ribbon-close
      >
        ×
      </button>
    </div>
    {{header}}
    <main id="main" tabindex="-1">{{main}}</main>
    {{footer}}
  </body>
</html>
